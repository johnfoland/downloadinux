services:
  downloadinux:
    build:
      context: .
    image: ${DOWNLOADINUX_IMAGE:-downloadinux:latest}
    hostname: downloadinux
    environment:
      DL_UID: ${DOWNLOADINUX_UID}
      DL_GID: ${DOWNLOADINUX_GID}
      TZ: ${DOWNLOADINUX_TZ}
    volumes:
      - type: bind
        source: ${DOWNLOADINUX_DOWNLOADS}
        target: /downloads
      - type: bind
        source: ${DOWNLOADINUX_PRESETS}
        target: /config
        read_only: true
      - type: bind
        source: ${DOWNLOADINUX_STATE}
        target: /state
      - type: bind
        source: ${DOWNLOADINUX_COOKIES}
        target: /cookies
      - type: volume
        source: nordvpn-data
        target: /var/lib/nordvpn
      - type: volume
        source: zsh-history
        target: /home/dl/.local/share/downloadinux
    stdin_open: true
    tty: true
    restart: unless-stopped
    # Docker's init is PID 1 and passes docker stop's SIGTERM to the worker,
    # which waits up to 20 seconds for its runners (Persistent worker and
    # jobs §1, "Packaging"; §5 "Shutdown").
    init: true
    stop_grace_period: 30s

volumes:
  nordvpn-data:
  zsh-history:
