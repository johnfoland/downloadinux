name: CI

# Pull requests only: every change reaches master through a squash-merged
# pull request whose own run already passed, so a second run on the push
# to master would repeat it.
on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The gate takes about 8 minutes; a hung test would otherwise hold the
    # job for GitHub's 6-hour default (#143).
    timeout-minutes: 25
    steps:
      # Depth 2: the pull request's merge commit and its first parent, the
      # base branch tip, so the next step can list what the pull request changes.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # A pull request that changes only Markdown files, anywhere, or LICENSE
      # skips the gate, and `check` still succeeds, so the required status
      # reports. Nothing in the gate reads them; a gate step that starts
      # reading one must narrow this pattern.
      - name: Detect a docs-only change
        id: scope
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          printf 'Changed files:\n%s\n' "$changed"
          if [ -n "$changed" ] && ! printf '%s\n' "$changed" \
              | grep -qvE '(\.md|^LICENSE)$'; then
            echo "Docs-only change: skipping the gate."
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: extractions/setup-just@v4
        if: steps.scope.outputs.docs_only != 'true'
        with:
          just-version: 1.40.0

      # The runner's preinstalled shellcheck is older and can disagree with
      # the local 0.11.0, so install the pinned release.
      - name: Install shellcheck 0.11.0
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"

      - name: Install zsh
        if: steps.scope.outputs.docs_only != 'true'
        run: sudo apt-get update && sudo apt-get install -y zsh

      # uv provisions Python from .python-version for the pytest step.
      # setup-uv publishes no floating major tag, so pin the release.
      - uses: astral-sh/setup-uv@v10.2.0
        if: steps.scope.outputs.docs_only != 'true'

      # The gate itself: CI runs exactly what `just check` runs locally.
      - run: just check
        if: steps.scope.outputs.docs_only != 'true'
