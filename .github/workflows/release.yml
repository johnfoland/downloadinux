name: Release

# release-please keeps a release PR open that bumps the version and updates
# CHANGELOG.md from Conventional Commits. Merging it tags vX.Y.Z and creates
# the GitHub release. Releases go nowhere else yet: to publish, add a job that
# needs `release-please` and runs when `release_created` is true.

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          # A PR opened with the built-in GITHUB_TOKEN waits for a maintainer
          # to approve its CI run. RELEASE_PLEASE_TOKEN (a fine-grained PAT:
          # this repo, Contents and Pull requests read/write) avoids that;
          # until it is set this falls back to GITHUB_TOKEN.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: master

