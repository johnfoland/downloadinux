# Weekly, grouped update pull requests. The Conventional Commit prefixes make
# dependency bumps release nothing on their own: they ship with the next feat
# or fix.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      dependencies:
        patterns: ["*"]
